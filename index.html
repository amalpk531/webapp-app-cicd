<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Version V2</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f4f4;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
      width: 320px;
    }

    h1 {
      color: #222;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      border: none;
      background: #111;
      color: white;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #444;
    }

    #status {
      margin-top: 20px;
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Version V1</h1>
    <p>Basic embedded HTML, CSS, and JavaScript example.</p>

    <button onclick="showMessage()">
      Click Me
    </button>

    <div id="status"></div>
  </div>

  <script>
    function showMessage() {
      document.getElementById("status").innerText =
        "JavaScript is working in V1";
    }
  </script>

</body>
</html>
